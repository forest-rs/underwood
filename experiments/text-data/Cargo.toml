[package]
name = "underwood_text_data_experiment"
version.workspace = true
authors = ["Underwood Contributors"]
edition.workspace = true
rust-version.workspace = true
description = "Private text-data distribution experiment for Underwood"
homepage = "https://github.com/forest-rs/underwood"
repository.workspace = true
license.workspace = true
publish = false
default-run = "underwood_text_data_experiment"

[features]
complex-scripts = ["parley_engine/complex-scripts"]
default = []

[dependencies]
parley_engine = { git = "https://github.com/waywardmonkeys/parley.git", rev = "9c41a4d0b9aa1aae7b8fdad8cf31728c9c3476bb", default-features = false, features = [
  "std",
] }

[lints]
workspace = true
