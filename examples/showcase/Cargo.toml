[package]
name = "underwood_showcase"
version.workspace = true
authors = ["Underwood Contributors"]
edition.workspace = true
# The published Imaging crates currently declare Rust 1.92.
rust-version = "1.92"
description = "Live, resizable document showcase for Underwood"
homepage = "https://github.com/forest-rs/underwood"
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
imaging.workspace = true
imaging_vello_cpu.workspace = true
png.workspace = true
softbuffer.workspace = true
underwood.workspace = true
underwood_parley = { workspace = true, features = [
  "complex-scripts",
  "system-fonts",
] }
winit.workspace = true

[lints]
workspace = true
